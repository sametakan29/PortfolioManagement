server:
  port: 8082

spring:
  application:
    name: log-consumer-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: log-consumer-group
      auto-offset-reset: earliest #ilk kez çalışıyorsa topicin en başından okmy başlar
      #deserializer:kafkadan gelen key/valuenin stringe çevrilmesi
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

opensearch:
  host: ${OPENSEARCH_HOST:opensearch}
  port: ${OPENSEARCH_PORT:9200}

logging:
  level:
    root: INFO
    com.toyotaborsa: DEBUG

kafka:
  topics:
    app-logs: ${KAFKA_LOG_TOPIC:app-logs}
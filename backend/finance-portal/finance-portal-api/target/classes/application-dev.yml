server:
  port: 8081

spring:
  application:
    name: finance-portal-api
  datasource:
    url: jdbc:postgresql://postgres:5432/finance_portal
    username: finance_user
    password: finance_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: kafka:9092
    client-id: finance-portal-api
    consumer:
      group-id: finance-portal-api
      auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/finance
          jwk-set-uri: http://keycloak:8080/realms/finance/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate.SQL: WARN
  config: classpath:log4j2-spring.xml

opentelemetry:
  traces:
    exporter: otlp
  otlp:
    endpoint: http://otel-collector:4318

jbpm:
  kie-server-id: finance-portal
  persistence-unit-name: org.jbpm.persistence.jpa

kafka:
  topics:
    app-logs: app-logs

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  application:
    name: finance-portal-api

# Default properties (overridden by profile-specific files)
server:
  port: 8081
  servlet:
    context-path: /

logging:
  config: classpath:log4j2-spring.xml

# RSS Feed Configuration for News
news:
  rss:
    enabled: true
    fetch-interval-minutes: 30 # Her 30 dakikada bir çek
    sources:
      # Türkiye Finans Haber Kaynakları
      - name: "Bloomberg HT"
        url: "https://www.bloomberght.com/rss"
        category: GENERAL_ECONOMY
        enabled: true
      
      - name: "Dünya Gazetesi Ekonomi"
        url: "https://www.dunya.com/feed/ekonomi"
        category: GENERAL_ECONOMY
        enabled: true
      
      - name: "Hürriyet Ekonomi"
        url: "https://www.hurriyet.com.tr/rss/ekonomi"
        category: GENERAL_ECONOMY
        enabled: true
      
      - name: "Investing.com Türkiye"
        url: "https://tr.investing.com/rss/news.rss"
        category: STOCK_MARKET
        enabled: true
      
      - name: "Para Analiz"
        url: "https://www.paraanaliz.com/feed/"
        category: FOREX
        enabled: true
      
      - name: "Mynet Finans"
        url: "https://finans.mynet.com/rss/borsa"
        category: STOCK_MARKET
        enabled: true

# Finance API Configuration
# Her kategori için sadece API Key ve URL verin
# Herhangi bir API sağlayıcısı kullanabilirsiniz
finance:
  api:
    # Döviz Kuru API
    forex:
      enabled: ${FOREX_ENABLED:true}
      api-key: ${FOREX_API_KEY:}  # TCMB için gerekli değil
      api-url: ${FOREX_API_URL:https://www.tcmb.gov.tr/kurlar/today.xml}
      # Örnek: https://www.tcmb.gov.tr/kurlar/today.xml (TCMB - ÜCRETSİZ, API key gerektirmez)
      # Örnek: https://www.alphavantage.co/query
      # Örnek: https://finnhub.io/api/v1
    
    # Hisse Senedi API
    stock:
      enabled: ${STOCK_ENABLED:false}
      api-key: ${STOCK_API_KEY:}
      api-url: ${STOCK_API_URL:}
      # Örnek: https://www.alphavantage.co/query
      # Örnek: https://finnhub.io/api/v1
      # Örnek: https://api.polygon.io
    
    # Tahvil/Bono API
    bond:
      enabled: ${BOND_ENABLED:false}
      api-key: ${BOND_API_KEY:}
      api-url: ${BOND_API_URL:}
      # Örnek: https://api.fiscaldata.treasury.gov
    
    # VIOP API
    viop:
      enabled: ${VIOP_ENABLED:false}
      api-key: ${VIOP_API_KEY:}
      api-url: ${VIOP_API_URL:}
      # Örnek: https://www.borsaistanbul.com/api
    
    # Fon API
    fund:
      enabled: ${FUND_ENABLED:false}
      api-key: ${FUND_API_KEY:}
      api-url: ${FUND_API_URL:}
      # Örnek: https://www.tefas.gov.tr/api
      # Örnek: https://www.spk.gov.tr/api

# Cache Configuration
cache:
  # Cache süreleri (dakika cinsinden)
  forex-ttl: 5      # Döviz kurları 5 dakika
  stock-ttl: 10     # Hisse verileri 10 dakika
  bond-ttl: 60      # Tahvil verileri 60 dakika
  viop-ttl: 10      # VIOP verileri 10 dakika
  fund-ttl: 60      # Fon verileri 60 dakika

# Scheduler Configuration
scheduler:
  enabled: ${SCHEDULER_ENABLED:true}
  # Cron ifadeleri için:
  # - Her 5 dakika: 0 */5 * * * *
  # - Her 10 dakika: 0 */10 * * * *
  # - Her saat: 0 0 * * * *
  forex-cron: ${FOREX_REFRESH_CRON:0 */5 * * * *}
  stock-cron: ${STOCK_REFRESH_CRON:0 */10 * * * *}
  bond-cron: ${BOND_REFRESH_CRON:0 0 * * * *}
  viop-cron: ${VIOP_REFRESH_CRON:0 */10 * * * *}
  fund-cron: ${FUND_REFRESH_CRON:0 0 * * * *}
